services:
  hknday:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hknday
    restart: unless-stopped
    tty: true
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./php.ini:/usr/local/etc/php/php.ini
    depends_on:
      - mysql
    command: sh -c "php artisan migrate:fresh --seed --force && php-fpm"
    # command: php-fpm
    networks:
      - app-network

  mysql:
    image: mysql:8
    container_name: mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=undian_dinkes
      - MYSQL_USER=undian_dinkes_db
      - MYSQL_PASSWORD=Dinkes2@25!!@
      - MYSQL_ROOT_PASSWORD=Dinkes2@25!!@
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 10

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: always
    ports:
      - "8000:80"
      # - "80:80"
      # - "443:443"
    volumes:
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf
      # - ./ssl_full/server.pem:/etc/nginx/hknday.pem
      - .:/var/www
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
